# ═══════════════════════════════════════════════════════════════
# GuidEasy Logistics — Docker Compose (Firebase Edition)
# Apenas a aplicação — dados armazenados no Firebase Firestore.
#   docker compose up -d
# ═══════════════════════════════════════════════════════════════

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ficheiro .env}
      NODE_ENV: production
      PORT: 3000
